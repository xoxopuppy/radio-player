<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  #player {
    background: #0d0d0d;
    border-radius: 3px;
    width: 100%;
    padding: 13px 32px;
    display: flex;
    align-items: center;
    gap: 28px;
    font-family: 'Space Mono', monospace;
  }
  #live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #7ab3e0;
    flex-shrink: 0;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }
  #clock { color: #7ab3e0; font-size: 12px; letter-spacing: 0.06em; flex-shrink: 0; min-width: 62px; text-align: right; }
  #waves { display: flex; align-items: center; gap: 3px; height: 16px; flex: 1; }
  .bar { flex: 1; background: #2a3d52; border-radius: 2px; transition: background 0.4s; max-width: 3px; }
  .bar.active { background: #7ab3e0; }
  #play-btn {
    background: transparent;
    border: 1px solid #7ab3e0;
    color: #7ab3e0;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    cursor: pointer;
    padding: 5px 14px;
    flex-shrink: 0;
    text-transform: uppercase;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
    min-width: 64px;
    text-align: center;
  }
  #play-btn:hover { background: #7ab3e0; color: #0d0d0d; }
</style>
</head>
<body>
<div id="player">
  <div id="live-dot"></div>
  <button id="play-btn">Play</button>
  <div id="waves">
    <div class="bar" style="height:4px"></div>
    <div class="bar" style="height:10px"></div>
    <div class="bar" style="height:6px"></div>
    <div class="bar" style="height:14px"></div>
    <div class="bar" style="height:8px"></div>
    <div class="bar" style="height:12px"></div>
    <div class="bar" style="height:4px"></div>
    <div class="bar" style="height:10px"></div>
    <div class="bar" style="height:6px"></div>
    <div class="bar" style="height:14px"></div>
    <div class="bar" style="height:8px"></div>
    <div class="bar" style="height:12px"></div>
    <div class="bar" style="height:5px"></div>
    <div class="bar" style="height:10px"></div>
    <div class="bar" style="height:7px"></div>
    <div class="bar" style="height:13px"></div>
    <div class="bar" style="height:5px"></div>
    <div class="bar" style="height:11px"></div>
    <div class="bar" style="height:4px"></div>
    <div class="bar" style="height:12px"></div>
    <div class="bar" style="height:7px"></div>
    <div class="bar" style="height:15px"></div>
    <div class="bar" style="height:6px"></div>
    <div class="bar" style="height:10px"></div>
  </div>
  <span id="clock">--:--:--</span>
</div>

<script>
  const LOOP = 1839;
  const AUDIO_URL = "https://pub-4b318b763d6641acb72762ac7e54181d.r2.dev/loop.mp3";
  const btn = document.getElementById('play-btn');
  const bars = document.querySelectorAll('.bar');
  const clock = document.getElementById('clock');
  let playing = false, audio = null, animFrame;

  function updateClock() {
    const now = new Date();
    clock.textContent = String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
  }
  setInterval(updateClock, 1000);
  updateClock();

  const baseH = [4,10,6,14,8,12,4,10,6,14,8,12,5,10,7,13,5,11,4,12,7,15,6,10];
  let phase = 0;
  function animateBars() {
    phase += 0.04;
    bars.forEach((b, i) => {
      const h = baseH[i] + Math.sin(phase + i * 0.7) * baseH[i] * 0.5;
      b.style.height = Math.max(2, Math.round(h)) + 'px';
    });
    animFrame = requestAnimationFrame(animateBars);
  }

  btn.addEventListener('click', () => {
    playing = !playing;
    if (playing) {
      btn.textContent = 'Pause';
      if (!audio) {
        audio = new Audio(AUDIO_URL);
       if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'channel 0',
    artist: 'on air',
  });
}
        audio.currentTime = Math.floor(Date.now()/1000) % LOOP;
        audio.addEventListener('ended', () => {
          audio.currentTime = Math.floor(Date.now()/1000) % LOOP;
          audio.play();
        });
      }
      audio.play();
      bars.forEach(b => b.classList.add('active'));
      animateBars();
    } else {
      btn.textContent = 'Play';
      audio.pause();
      bars.forEach((b,i) => { b.classList.remove('active'); b.style.height = baseH[i]+'px'; });
      cancelAnimationFrame(animFrame);
    }
  });
</script>
</body>
</html>
